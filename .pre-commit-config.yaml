repos:
- repo: https://github.com/andrewaylett/pre-commit-hooks
  rev: v0.9.0
  hooks:
  - id: init-hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: forbid-submodules
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-added-large-files
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
  - id: pretty-format-json
    args: [--autofix, --indent, "2", --no-sort-keys]
  - id: check-xml
- repo: https://github.com/google/yamlfmt
  rev: v0.21.0
  hooks:
  - id: yamlfmt
- repo: https://github.com/editorconfig-checker/editorconfig-checker.python
  rev: 3.11.1
  hooks:
  - id: editorconfig-checker
    # Binary files, and a licence that is not ours to reformat.
    exclude: \.png$|^LICENSE$
- repo: https://github.com/jdx/jactionlint
  rev: v2.6.0
  hooks:
  - id: jactionlint
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.39.0
  hooks:
  - id: check-github-workflows
  - id: check-renovate
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.32.0
  hooks:
  - id: zizmor
    args:
    - --no-progress
    - --fix=all
- repo: https://github.com/renovatebot/pre-commit-hooks
  rev: 44.238.3
  hooks:
  - id: renovate-config-validator
    args:
    - --strict
- repo: https://github.com/AleksaC/hadolint-py
  rev: v2.15.1
  hooks:
  - id: hadolint
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    # The app's scripts run under bashio and have no extension, so pre-commit
    # doesn't know they are shell.
    files: ^(quiddity/rootfs/(etc/(cont-init|services)\.d|usr/local/bin)/|scripts/)
    types: [file]
