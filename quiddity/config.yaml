name: Quiddity
version: "0.1.0-alpha.2"
slug: quiddity
description: An always-on Quiddity node, so your devices can sync without being online together
url: https://github.com/quiddity-app/quiddity-home-assistant-app
image: ghcr.io/quiddity-app/quiddity-home-assistant-app
arch:
- aarch64
- amd64
stage: experimental
startup: application
boot: auto
# Home Assistant's base image has its own init, in the form of the s6 overlay.
init: false
# Stopping gives the node time to finish saving.
timeout: 30

# The graph is one SQLite file beside a blob database, and a copy taken while
# the node writes to them can be torn. So a backup keeps a Markdown export that
# the node writes just before it (backup_pre), and leaves the live files out.
# What that costs is in DOCS.md: the node's identity and its stored files.
backup: hot
backup_pre: /usr/local/bin/quiddity-backup-pre
backup_exclude:
- graph/*
- export.new
- export.new/*

# The node needs no mapped folders: the graph, its blobs, its identity and the
# export are all in /data.

ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: Quiddity
panel_admin: true

options:
  allowed_devices: []
  initial_graph: empty
  log_level: warn
schema:
  # Quiddity device IDs: 64 hexadecimal digits.
  allowed_devices:
  - match(^[0-9a-fA-F]{64}$)
  initial_graph: list(empty|new|restore)
  log_level: list(error|warn|info|debug|trace)
