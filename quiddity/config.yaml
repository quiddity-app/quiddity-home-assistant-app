name: Quiddity
version: "0.1.0-alpha.2.2"
slug: quiddity
description: An always-on Quiddity node, so your devices can sync without being online together
url: https://github.com/quiddity-app/quiddity-home-assistant-app
image: ghcr.io/quiddity-app/quiddity-home-assistant-app
arch:
- aarch64
- amd64
stage: experimental
startup: application
boot: auto
# Home Assistant's base image has its own init, in the form of the s6 overlay.
init: false
# Stopping gives the node time to finish saving.
timeout: 30

# The graph is one SQLite file, and a copy taken while the node writes to it can
# be torn. So a backup keeps what is made just before it (backup_pre): a
# Markdown export, and a compressed, consistent copy of the file in /data/database
# for restoring the graph as it was (initial_graph: restore). The live file is
# left out.
backup: hot
backup_pre: /usr/local/bin/quiddity-backup-pre
backup_exclude:
- graph/*
- export.new
- export.new/*
- database/*.part

# The node needs no mapped folders: the graph, its blobs, its identity and the
# export are all in /data.

ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: Quiddity
panel_admin: true

options:
  allowed_devices: []
  initial_graph: empty
  log_level: warn
schema:
  # Quiddity device IDs: 64 hexadecimal digits.
  allowed_devices:
  - match(^[0-9a-fA-F]{64}$)
  initial_graph: list(empty|new|restore)
  log_level: list(error|warn|info|debug|trace)
